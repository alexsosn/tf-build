name: Public TF corpus coverage

on:
  push:
  pull_request:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test coverage policy (offline)
        run: python -m unittest discover -s tests -p test_public_tf_corpora.py -v
      - name: Verify public repositories and open TF implementation issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/audit_public_tf_corpora.py
