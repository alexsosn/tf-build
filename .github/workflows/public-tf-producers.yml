name: Public TF producer coverage

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-tf-producers-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline policy/adversarial tests
        run: |
          python -m pip install 'pytest>=8,<10'
          python -m pytest -q tests/test_audit_tf_producers.py
      - name: Read-only public owner and producer audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/audit_tf_producers.py policy/public-tf-producers.json
