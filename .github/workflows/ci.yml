name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy
      - name: Tests
        run: python -m pytest -q

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel without editable installation
        run: python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheels" .
      - name: Installed wheel smoke (RED then GREEN)
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/tf-build-wheel-venv"
          vpy="$RUNNER_TEMP/tf-build-wheel-venv/bin/python"
          cd "$RUNNER_TEMP"
          if "$vpy" "$GITHUB_WORKSPACE/scripts/check_installed_wheel.py" "$GITHUB_WORKSPACE"; then
            echo "Unexpected success before installing the distribution wheel" >&2
            exit 1
          fi
          "$vpy" -m pip install "$RUNNER_TEMP"/wheels/tf_build-*.whl
          "$vpy" "$GITHUB_WORKSPACE/scripts/check_installed_wheel.py" "$GITHUB_WORKSPACE"
