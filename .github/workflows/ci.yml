name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy
      - name: Tests
        run: python -m pytest -q

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull_request's default GITHUB_SHA may identify its synthetic merge
          # commit. Manifest the literal source head that produced the wheel.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and source distribution without editable installation
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'build>=1,<2'
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheels" .
          python -m build --sdist --outdir "$RUNNER_TEMP/sdist" .
      - name: Installed wheel smoke (RED then GREEN)
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/tf-build-wheel-venv"
          vpy="$RUNNER_TEMP/tf-build-wheel-venv/bin/python"
          cd "$RUNNER_TEMP"
          if "$vpy" "$GITHUB_WORKSPACE/scripts/check_installed_wheel.py" "$GITHUB_WORKSPACE"; then
            echo "Unexpected success before installing the distribution wheel" >&2
            exit 1
          fi
          "$vpy" -m pip install "$RUNNER_TEMP"/wheels/tf_build-*.whl
          "$vpy" "$GITHUB_WORKSPACE/scripts/check_installed_wheel.py" "$GITHUB_WORKSPACE"
      - name: Prepare local wheelhouse with dependencies (online acquisition)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wheelhouse"
          cp "$RUNNER_TEMP"/wheels/tf_build-*.whl "$RUNNER_TEMP/wheelhouse/"
          python -m pip wheel --wheel-dir "$RUNNER_TEMP/wheelhouse" "$RUNNER_TEMP"/wheels/tf_build-*.whl
      - name: Test fresh offline installation without Git or index
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/tf-build-offline-venv"
          vpy="$RUNNER_TEMP/tf-build-offline-venv/bin/python"
          cd "$RUNNER_TEMP"
          "$vpy" -m pip install --no-index --find-links "$RUNNER_TEMP/wheelhouse" "$RUNNER_TEMP"/wheels/tf_build-*.whl
          "$vpy" "$GITHUB_WORKSPACE/scripts/check_installed_wheel.py" "$GITHUB_WORKSPACE"
      - name: Manifest source revision, tested wheel and wheelhouse SHA256
        shell: bash
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/scripts/wheel_manifest.py" \
            --wheel-dir "$RUNNER_TEMP/wheels" \
            --wheelhouse "$RUNNER_TEMP/wheelhouse" \
            --sdist-dir "$RUNNER_TEMP/sdist" \
            --release-tag "v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" \
            --pyproject "$GITHUB_WORKSPACE/pyproject.toml" \
            --revision "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" \
            --output "$RUNNER_TEMP/wheels/wheel-manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: tf-build-dev-wheel-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/wheels/*.whl
            ${{ runner.temp }}/sdist/*.tar.gz
            ${{ runner.temp }}/wheels/wheel-manifest.json
            ${{ runner.temp }}/wheelhouse/*.whl
